<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name - Resume</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a2e;
            --accent: #e94560;
            --secondary: #0f3460;
            --bg: #f8f9fa;
            --text: #2d3436;
            --text-light: #636e72;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            z-index: 1000;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Header with Diagonal Split */
        header {
            position: relative;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 8rem 0 6rem;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            right: -20%;
            width: 60%;
            height: 100%;
            background: var(--accent);
            transform: skewX(-15deg);
            opacity: 0.15;
            animation: slideIn 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from {
                transform: skewX(-15deg) translateX(100%);
            }
            to {
                transform: skewX(-15deg) translateX(0);
            }
        }

        .header-content {
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 900;
            color: white;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .subtitle {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        .contact-info {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            margin-top: 2.5rem;
            animation: fadeInUp 0.8s ease-out 0.4s backwards;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255, 255, 255, 0.95);
            text-decoration: none;
            font-size: 1rem;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .contact-item:hover {
            color: white;
            transform: translateX(3px);
        }

        /* Section Styling */
        section {
            padding: 5rem 0;
            position: relative;
        }

        section:nth-child(even) {
            background: white;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 900;
            margin-bottom: 3rem;
            position: relative;
            display: inline-block;
            color: var(--primary);
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 60px;
            height: 5px;
            background: var(--accent);
            border-radius: 3px;
        }

        /* Experience & Education Cards */
        .timeline-item {
            margin-bottom: 3rem;
            padding-left: 3rem;
            position: relative;
            border-left: 3px solid var(--accent);
            transition: transform 0.3s ease;
        }

        .timeline-item:hover {
            transform: translateX(8px);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -9px;
            top: 0;
            width: 15px;
            height: 15px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 0 4px var(--bg);
        }

        section:nth-child(even) .timeline-item::before {
            box-shadow: 0 0 0 4px white;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0.8rem;
        }

        .job-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .company {
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .date {
            font-size: 0.95rem;
            color: var(--text-light);
            font-weight: 500;
        }

        .timeline-item ul {
            margin-left: 1.5rem;
            margin-top: 1rem;
        }

        .timeline-item li {
            margin-bottom: 0.6rem;
            color: var(--text);
        }

        /* Skills Section */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .skill-category {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        section:nth-child(even) .skill-category {
            background: var(--bg);
        }

        .skill-category:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .skill-category h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .skill-category h3::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .skill-tag {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: transform 0.2s ease;
        }

        .skill-tag:hover {
            transform: scale(1.05);
        }

        /* Projects */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
            margin-top: 2rem;
        }

        .project-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        section:nth-child(even) .project-card {
            background: var(--bg);
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .project-header {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            padding: 2rem;
            color: white;
        }

        .project-card h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .project-content {
            padding: 2rem;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1.2rem;
        }

        .tech-badge {
            background: var(--accent);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Footer */
        footer {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 3rem 0;
        }

        footer p {
            opacity: 0.8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 5rem 0 4rem;
            }

            section {
                padding: 3rem 0;
            }

            .timeline-item {
                padding-left: 2rem;
            }

            .contact-info {
                flex-direction: column;
                gap: 1rem;
            }

            .skills-grid,
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Scroll Animation */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="grain"></div>

    <header>
        <div class="container header-content">
            <h1 id="name"></h1>
            <p class="subtitle" id="title"></p>
            <div class="contact-info" id="contact-info"></div>
        </div>
    </header>

    <section>
        <div class="container">
            <h2 class="section-title fade-in">About Me</h2>
            <p class="fade-in" style="font-size: 1.15rem; line-height: 1.8; max-width: 800px;" id="about"></p>
        </div>
    </section>

    <section>
        <div class="container">
            <h2 class="section-title fade-in">Experience</h2>
            <div id="experience-container"></div>
        </div>
    </section>

    <section>
        <div class="container">
            <h2 class="section-title fade-in">Skills</h2>
            <div class="skills-grid" id="skills-container"></div>
        </div>
    </section>

    <section>
        <div class="container">
            <h2 class="section-title fade-in">Featured Projects</h2>
            <div class="projects-grid" id="projects-container"></div>
        </div>
    </section>

    <section>
        <div class="container">
            <h2 class="section-title fade-in">Education</h2>
            <div id="education-container"></div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p id="footer-text"></p>
        </div>
    </footer>

    <!-- Load the data -->
    <script src="data.js"></script>

    <script>
        // Populate the page with data from data.js
        function populatePage() {
            // Personal info
            document.getElementById('name').textContent = resumeData.personal.name;
            document.getElementById('title').textContent = resumeData.personal.title;
            document.getElementById('about').textContent = resumeData.about;

            // Contact info
            const contactInfo = document.getElementById('contact-info');
            contactInfo.innerHTML = `
                <a href="mailto:${resumeData.personal.email}" class="contact-item">
                    <span>✉</span> ${resumeData.personal.email}
                </a>
                <a href="tel:${resumeData.personal.phone.replace(/\D/g, '')}" class="contact-item">
                    <span>📱</span> ${resumeData.personal.phone}
                </a>
                <a href="${resumeData.personal.linkedin}" class="contact-item" target="_blank">
                    <span>💼</span> LinkedIn
                </a>
                <a href="${resumeData.personal.github}" class="contact-item" target="_blank">
                    <span>💻</span> GitHub
                </a>
            `;

            // Experience
            const experienceContainer = document.getElementById('experience-container');
            experienceContainer.innerHTML = resumeData.experience.map(exp => `
                <div class="timeline-item fade-in">
                    <div class="timeline-header">
                        <div>
                            <div class="company">${exp.company}</div>
                            <div class="job-title">${exp.position}</div>
                        </div>
                        <div class="date">${exp.startDate} - ${exp.endDate}</div>
                    </div>
                    <ul>
                        ${exp.responsibilities.map(resp => `<li>${resp}</li>`).join('')}
                    </ul>
                </div>
            `).join('');

            // Skills
            const skillsContainer = document.getElementById('skills-container');
            skillsContainer.innerHTML = resumeData.skills.map(skillGroup => `
                <div class="skill-category fade-in">
                    <h3>${skillGroup.category}</h3>
                    <div class="skill-tags">
                        ${skillGroup.items.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
                    </div>
                </div>
            `).join('');

            // Projects
            const projectsContainer = document.getElementById('projects-container');
            projectsContainer.innerHTML = resumeData.projects.map(project => `
                <div class="project-card fade-in">
                    <div class="project-header">
                        <h3>${project.title}</h3>
                    </div>
                    <div class="project-content">
                        <p>${project.description}</p>
                        <div class="project-tech">
                            ${project.technologies.map(tech => `<span class="tech-badge">${tech}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');

            // Education
            const educationContainer = document.getElementById('education-container');
            educationContainer.innerHTML = resumeData.education.map(edu => `
                <div class="timeline-item fade-in">
                    <div class="timeline-header">
                        <div>
                            <div class="company">${edu.institution}</div>
                            <div class="job-title">${edu.degree}</div>
                        </div>
                        <div class="date">${edu.startDate} - ${edu.endDate}</div>
                    </div>
                    <p>${edu.details}</p>
                </div>
            `).join('');

            // Footer
            document.getElementById('footer-text').textContent = `© ${new Date().getFullYear()} ${resumeData.personal.name}. All rights reserved.`;

            // Re-observe fade-in elements after DOM update
            document.querySelectorAll('.fade-in').forEach(el => {
                observer.observe(el);
            });
        }

        // Scroll animation
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        // Initialize page
        populatePage();
    </script>
</body>
</html>
